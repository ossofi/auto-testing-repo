name: Run Cypress Tests

on:
  push:
    branches:
      - ui_testing
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Install Required Browsers & Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable firefox xvfb libgtk-3-0 libgbm-dev libasound2t64
          
      - name: Verify Cypress Installation
        run: npx cypress verify

      - name: Set TERM Variable
        run: echo "TERM=xterm" >> $GITHUB_ENV

      - name: Run Cypress Tests in Parallel (Chrome & Firefox)
        run: |
          npx cypress run --record --parallel --browser chrome || echo "Chrome test failed"
          npx cypress run --record --parallel --browser firefox || echo "Firefox test failed"

      - name: Ensure Report Directory Exists
        run: mkdir -p cypress/reports

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/reports/
