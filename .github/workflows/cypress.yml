name: Run Cypress Tests

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'  # Runs tests daily

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: npm install

      - name: Run Cypress Tests
        run: npx cypress run --browser chrome
